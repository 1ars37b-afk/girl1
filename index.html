<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التوعية بسرطان الثدي</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #FFC0CB; /* لون وردي فاتح جداً */
            color: #4B0082; /* لون بنفسجي غامق للنص */
            text-align: center;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            margin: 30px auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #FF1493; /* لون وردي زاهي */
            font-size: 28px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 24px;
            color: #E91E63;
        }
        ul {
            list-style: none;
            padding: 0;
            text-align: right;
            margin-top: 20px;
        }
        li {
            background-color: #FFF0F5; /* خلفية وردية خفيفة للعناصر */
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            border-right: 5px solid #FF69B4; /* خط وردي جميل على اليمين */
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>صحتك تهمنا 💗</h1>
        <h2>🎀 التوعية بسرطان الثدي 🎀</h2>

        <ul>
            <li>الفحص المبكر يمكن أن ينقذ حياتك.</li>
            <li>احرصي على فحص الثدي ذاتياً مرة كل شهر.</li>
            <li>الأعراض تشمل تغيرات في شكل الثدي أو وجود كتل.</li>
            <li>تذكري أن الفحص الدوري لدى الطبيب مهم.</li>
        </ul>
        
        <p style="margin-top: 30px; color: #888;">برنامج توعوي بسيط</p>
    </div>
</body>
</html>
